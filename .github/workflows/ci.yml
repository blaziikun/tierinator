# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
#  Every push and pull request: secret scan over the whole history, identity guard,
#  audit, lint, types, dead code, unit tests, browser tests, build. Pushes to main
#  that pass all of it are deployed to tierinator.sayel.dev (secrets
#  CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the `production` environment,
#  and the repository secret PRIVATE_WORDS; see docs/hosting.md).
#
#  Third-party actions are pinned to exact commits, so a moved tag can't change
#  what runs here. Versions are in the comments; Dependabot keeps them current.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
    push:
        branches: [main]
    pull_request:

# read-only by default; nothing here writes to the repository
permissions:
    contents: read

# a newer push to a pull request cancels the older run; on main every run finishes, so a deploy is never cut off
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Gitleaks over every commit on every branch and tag, on every run. (The Gitleaks action only scans the
    # commits a push adds, and downloads its binary unchecked, so it's built here from source instead.)
    secrets:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # the whole history, every branch and tag
                  persist-credentials: false
            # The runner's own Go builds an exact release. Go checks the source against sum.golang.org's public,
            # append-only log (and fetches a newer Go the same way if Gitleaks needs one), so a release changed
            # after the fact can't run here. To update: docs/security.md {6}.
            - name: Install Gitleaks
              run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
            - name: Gitleaks over every commit
              run: |
                  "$(go env GOPATH)/bin/gitleaks" git --log-opts=--all --redact --verbose --no-banner .

    # Nothing public may contain one of my private words (scripts/identity-guard.ts, docs/security.md {8}). The only step that
    # sees PRIVATE_WORDS is the guard itself. Pull requests from forks never get secrets, so they skip this job;
    # the push to main that merges one runs it, and the deploy waits for it.
    identity:
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # every commit's author and every file ever committed
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build # the guard checks the built site too
            - name: Identity guard (the repository, its history, the built site)
              run: pnpm guard --dist
              env:
                  PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }} # empty if the secret is missing, and then the guard fails

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod --audit-level high
            - run: pnpm lint
            - run: pnpm check
            - run: pnpm knip
            - run: pnpm test:unit
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            - run: pnpm build
            - name: Keep the browser-test report if something failed
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 7

    deploy:
        needs: [secrets, identity, test]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # one deploy at a time, never cancelled halfway
        concurrency:
            group: deploy
            cancel-in-progress: false
        environment:
            name: production
            url: https://tierinator.sayel.dev
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm exec wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
